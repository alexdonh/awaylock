name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The image's default Xcode can lag; pick the newest stable 27.x.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: xcodebuild -scheme AwayLock -destination 'platform=macOS' -derivedDataPath build/dd test
      - name: Build the spike tool
        run: xcodebuild -scheme Spike -derivedDataPath build/dd build
