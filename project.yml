name: Nearby
options:
  deploymentTarget:
    macOS: "26.0"
  defaultSourceDirectoryType: syncedFolder
  settingPresets: none
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Nearby:
    type: application
    platform: macOS
    sources:
      - path: Nearby
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Nearby
        PRODUCT_BUNDLE_IDENTIFIER: $(NEARBY_BUNDLE_ID)
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Nearby/Info.plist
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nearby
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Nearby reads the signal strength of the device you choose so it can lock your Mac when you walk away.
        INFOPLIST_KEY_NSHumanReadableCopyright: © 2026
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
  NearbyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NearbyTests
    dependencies:
      - target: Nearby
    settings:
      base:
        PRODUCT_NAME: NearbyTests
        PRODUCT_BUNDLE_IDENTIFIER: $(NEARBY_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Nearby.app/Contents/MacOS/Nearby
        BUNDLE_LOADER: $(TEST_HOST)
  Spike:
    type: tool
    platform: macOS
    sources:
      - path: Spike
    settings:
      base:
        PRODUCT_NAME: spike
        PRODUCT_BUNDLE_IDENTIFIER: $(NEARBY_BUNDLE_ID).spike
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Spike reads Bluetooth LE adverts to test device tracking.
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Nearby:
    build:
      targets:
        Nearby: all
        NearbyTests: [test]
    test:
      targets:
        - NearbyTests
  Spike:
    build:
      targets:
        Spike: all
    run:
      config: Debug
