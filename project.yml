name: AwayLock
options:
  deploymentTarget:
    macOS: "26.0"
  defaultSourceDirectoryType: syncedFolder
  settingPresets: none
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  AwayLock:
    type: application
    platform: macOS
    sources:
      - path: AwayLock
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: AwayLock
        PRODUCT_BUNDLE_IDENTIFIER: $(AWAYLOCK_BUNDLE_ID)
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: AwayLock/Info.plist
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: AwayLock
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: AwayLock reads the signal strength of the device you choose so it can lock your Mac when you walk away.
        INFOPLIST_KEY_NSHumanReadableCopyright: © 2026
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
  AwayLockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AwayLockTests
    dependencies:
      - target: AwayLock
    settings:
      base:
        PRODUCT_NAME: AwayLockTests
        PRODUCT_BUNDLE_IDENTIFIER: $(AWAYLOCK_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AwayLock.app/Contents/MacOS/AwayLock
        BUNDLE_LOADER: $(TEST_HOST)
  Spike:
    type: tool
    platform: macOS
    sources:
      - path: Spike
    settings:
      base:
        PRODUCT_NAME: spike
        PRODUCT_BUNDLE_IDENTIFIER: $(AWAYLOCK_BUNDLE_ID).spike
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Spike reads Bluetooth LE adverts to test device tracking.
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  AwayLock:
    build:
      targets:
        AwayLock: all
        AwayLockTests: [test]
    test:
      targets:
        - AwayLockTests
  Spike:
    build:
      targets:
        Spike: all
    run:
      config: Debug
